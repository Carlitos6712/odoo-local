; =============================================================================
; odoo.conf - Configuración del servidor Odoo
; Autor: @Carlitos6712 (https://github.com/Carlitos6712)
;
; Docker monta esta carpeta en /etc/odoo dentro del contenedor.
; Tras editar este archivo, ejecuta "./odoo.sh restart" para aplicar los cambios.
;
; Los datos de conexión a PostgreSQL (host, usuario, contraseña) NO están aquí:
; los pone docker-compose.yml a partir de .env, para no versionar contraseñas.
; =============================================================================

[options]

; Contraseña maestra ("master password"). Protege el gestor de bases de datos
; (crear, copiar, borrar y restaurar bases). Es solo para uso local: cámbiala si
; quieres. Si la quitas, Odoo intentará generar una y guardarla en este archivo.
admin_passwd = admin

; Carpeta con tus módulos propios (./addons en tu ordenador).
; Los módulos oficiales de Odoo ya se cargan solos; no hace falta añadirlos.
addons_path = /mnt/extra-addons

; Carpeta donde Odoo guarda el filestore (adjuntos, imágenes, sesiones).
; Coincide con el volumen "odoo-web-data" de docker-compose.yml.
data_dir = /var/lib/odoo

; Muestra el gestor de bases de datos en http://localhost:8079/web/database/manager
; (8079 o el puerto que tengas en ODOO_PORT dentro de .env).
; En local lo queremos activo para poder crear bases de datos desde el navegador.
list_db = True

; Nivel de detalle de los logs: debug, info, warn, error.
; "info" es suficiente para el día a día; usa "debug" para investigar errores.
log_level = info

; Número de procesos de trabajo. 0 = modo de un solo proceso, ideal para
; desarrollo porque consume poca memoria y facilita depurar.
workers = 0

; Sin límite de tiempo por petición en desarrollo. Evita que Odoo corte
; operaciones largas (instalar apps grandes, importar datos) en tu máquina.
limit_time_cpu = 0
limit_time_real = 0
